<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Démo widget Devis AI — site client</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        color: #1e293b;
        background: linear-gradient(180deg, #eff6ff, #ffffff 40%);
      }
      header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 20px 6vw;
      }
      .brand { font-weight: 700; font-size: 20px; color: #2563eb; }
      nav a { margin-left: 24px; color: #475569; text-decoration: none; font-size: 14px; }
      main { padding: 6vw; max-width: 760px; }
      h1 { font-size: clamp(2rem, 5vw, 3rem); line-height: 1.1; margin: 0 0 16px; }
      p.lead { font-size: 18px; color: #475569; max-width: 48ch; }
      .hint {
        margin-top: 40px; padding: 16px 18px; border-radius: 12px;
        background: #fef9c3; border: 1px solid #fde68a; color: #854d0e; font-size: 14px; max-width: 52ch;
      }
    </style>
  </head>
  <body>
    <header>
      <span class="brand">Plomberie Martin</span>
      <nav>
        <a href="#">Services</a>
        <a href="#">Réalisations</a>
        <a href="#">Contact</a>
      </nav>
    </header>
    <main>
      <h1>Votre plombier de confiance à Paris</h1>
      <p class="lead">
        Dépannage, rénovation, installation. Intervention rapide et devis gratuit.
      </p>
      <div class="hint">
        👉 Ceci est un site client fictif. Le widget Devis AI est chargé en bas à droite —
        cliquez sur la bulle pour discuter avec l'assistant.
      </div>
    </main>

    <!-- Intégration du widget (une seule ligne à copier sur n'importe quel site) -->
    <script
      type="module"
      src="./src/embed.js"
      data-company="demo"
      data-api="http://localhost:8000"
    ></script>
  </body>
</html>
