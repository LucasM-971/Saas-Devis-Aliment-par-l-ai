version: 2
updates:
  - package-ecosystem: npm
    directory: /dashboard
    schedule: { interval: weekly }
    groups:
      minor-patch: { update-types: [minor, patch] }
  - package-ecosystem: pip
    directory: /backend
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directory: /backend
    schedule: { interval: monthly }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
