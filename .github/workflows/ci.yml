name: CI

on:
  push:
    branches: [dev, staging, prod]
  pull_request:
    branches: [dev, staging, prod]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dashboard:
    name: Dashboard (lint · types · tests · build · audit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Vérification des types
        run: npm run typecheck
      - name: Tests unitaires
        run: npm run test
      - name: Build de production
        run: npm run build
      - name: Audit des dépendances (prod, high+)
        run: npm audit --omit=dev --audit-level=high

  widget:
    name: Widget (syntaxe JS)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Vérifier la syntaxe des modules
        run: for f in widget/src/*.js; do node --check "$f"; done

  backend:
    name: Backend (lint · tests · audit)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: devis_ai_test
          MYSQL_USER: devis
          MYSQL_PASSWORD: devis
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      TEST_DATABASE_URL: mysql+pymysql://devis:devis@127.0.0.1:3306/devis_ai_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Dépendances système (WeasyPrint)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0

      - name: Installer les dépendances
        run: pip install -r requirements.txt ruff pip-audit

      - name: Lint (erreurs bloquantes uniquement)
        run: ruff check --select E9,F63,F7,F82 .

      - name: Vérifier l'import de l'application
        run: python -c "import app.main"

      - name: Tests unitaires
        run: pytest -q

      - name: Audit des dépendances
        run: pip-audit -r requirements.txt

  docker:
    name: Image Docker backend (build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - name: Build (sans push)
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
