# Production pilote (VPS) — docker compose -f docker-compose.prod.yml up -d
#
# Principes :
# - MySQL n'est PAS exposé : joignable uniquement sur le réseau compose interne.
# - Les secrets vivent dans backend/.env.prod (jamais commité) —
#   voir backend/.env.prod.example pour la liste des variables.
# - TLS : terminé par un reverse proxy (Caddy ou Nginx) sur l'hôte, qui proxifie
#   vers backend:8000 ; poser TRUST_PROXY_HEADERS=true dans .env.prod pour que
#   le rate limiting voie la vraie IP client (X-Forwarded-For).
# - Sauvegardes : dump quotidien compressé, rotation 14 jours, dans ./backups
#   (répertoire HORS volume Docker : copiez-le hors du VPS régulièrement).

services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    env_file: ./backend/.env.prod # MYSQL_ROOT_PASSWORD, MYSQL_DATABASE, MYSQL_USER, MYSQL_PASSWORD
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h localhost -p"$$MYSQL_PASSWORD"']
      interval: 10s
      retries: 10

  backend:
    # Le CD publie l'image sur GHCR et passe BACKEND_IMAGE ; en local, build classique.
    image: ${BACKEND_IMAGE:-devis-ai-backend:local}
    build: ./backend
    restart: unless-stopped
    env_file: ./backend/.env.prod # DATABASE_URL, SECRET_KEY, ANTHROPIC_API_KEY, SMTP_*, SENTRY_DSN…
    # Pas de "ports" : seul le reverse proxy de l'hôte joint le conteneur.
    # Si le proxy tourne SUR l'hôte (hors compose), décommentez l'exposition
    # locale : ports: ['127.0.0.1:8000:8000']
    ports:
      - '127.0.0.1:8000:8000'
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://localhost:8000/health']
      interval: 15s
      retries: 6

  backup:
    image: mysql:8.4
    restart: unless-stopped
    env_file: ./backend/.env.prod
    volumes:
      - ./backups:/backups
      - ./backend/scripts/backup_mysql.sh:/backup.sh:ro
    entrypoint: ['/bin/sh', '-c', 'while true; do /backup.sh || echo "backup KO"; sleep 86400; done']
    depends_on:
      db:
        condition: service_healthy

volumes:
  dbdata:
