name: saas-devis


# Dev local : backend + MySQL + dashboard. Schéma créé par Alembic au démarrage.

services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: devis_ai
      MYSQL_USER: devis
      MYSQL_PASSWORD: devis
    # 3307 pour ne pas entrer en conflit avec un MySQL local
    ports:
      - '3307:3306'
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-pdevis']
      interval: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      # Valeurs de dev ; secrets réels dans backend/.env
      DATABASE_URL: mysql+pymysql://devis:devis@db:3306/devis_ai
    env_file:
      - path: ./backend/.env
        required: false
    ports:
      # BACKEND_PORT=8017 docker compose up  si le 8000 est déjà pris sur l'hôte.
      - '${BACKEND_PORT:-8000}:8000'
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://localhost:8000/health']
      interval: 10s
      retries: 6

  # Seed des données de démo : docker compose run --rm seed
  seed:
    build: ./backend
    entrypoint: ['python', '-m', 'scripts.seed']
    environment:
      DATABASE_URL: mysql+pymysql://devis:devis@db:3306/devis_ai
    env_file:
      - path: ./backend/.env
        required: false
    depends_on:
      backend:
        condition: service_healthy
    profiles: ['seed']

  dashboard:
    image: node:22-alpine
    working_dir: /app
    # Binaires natifs Linux
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0 --port 5173 --strictPort"
    environment:
      # Appels /api relayés par le proxy Vite
      VITE_API_URL: ''
      API_PROXY_TARGET: http://backend:8000
    volumes:
      - ./dashboard:/app
      # Volume nommé qui masque le node_modules de l'hôte.
      - dashboard_node_modules:/app/node_modules
    ports:
      - '5173:5173'
    depends_on:
      backend:
        condition: service_healthy

volumes:
  dbdata:
  dashboard_node_modules:
