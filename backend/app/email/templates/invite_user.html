<!doctype html>
<html lang="fr">
  <body style="margin:0;padding:24px;background:#f8fafc;font-family:Helvetica,Arial,sans-serif;color:#0f172a;">
    <div style="max-width:560px;margin:0 auto;background:#ffffff;border:1px solid #e2e8f0;border-radius:12px;padding:28px;">
      <p style="margin:0 0 12px;font-size:18px;font-weight:bold;">Rejoignez {company_name} sur Devis AI</p>
      <p style="margin:0 0 16px;">
        <strong>{inviter_name}</strong> vous invite à rejoindre l'équipe de
        <strong>{company_name}</strong> en tant que <strong>{role_label}</strong>.
      </p>
      <p style="margin:0 0 24px;">
        <a href="{invite_url}" style="display:inline-block;background:#ea580c;color:#ffffff;text-decoration:none;padding:10px 20px;border-radius:8px;font-weight:bold;">
          Accepter l'invitation
        </a>
      </p>
      <p style="margin:0;color:#64748b;font-size:13px;">
        Ce lien est valable 7 jours. Si vous ne connaissez pas cette entreprise, ignorez cet e-mail.
      </p>
    </div>
  </body>
</html>
