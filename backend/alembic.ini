# Configuration Alembic — l'URL réelle est injectée depuis app.config dans alembic/env.py
[alembic]
script_location = alembic
sqlalchemy.url = mysql+pymysql://devis:devis@localhost:3306/devis_ai

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
